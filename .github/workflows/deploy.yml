name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit sha (short or full) to deploy; a previous sha rolls back
        required: true
        default: main

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/silagy/drivinglessonsbooking

jobs:
  resolve:
    name: Resolve commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the ref to one full commit sha
        id: sha
        env:
          REF: ${{ inputs.ref }}
        run: |
          sha=$(git rev-parse --verify --quiet "origin/$REF^{commit}" \
                || git rev-parse --verify --quiet "$REF^{commit}") || {
            echo "Cannot resolve '$REF' to a commit of this repository (branch, tag or sha)." >&2
            exit 1
          }
          echo "Deploying $REF = $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  image:
    name: Build and push image
    needs: [resolve, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.resolve.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: [resolve, image]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.DEPLOY_DOMAIN }}
    env:
      APP_TAG: ${{ needs.resolve.outputs.sha }}
      DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
      TARGET: deploy@${{ secrets.DEPLOY_HOST }}
      SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy release files
        run: |
          printf 'APP_TAG=%s\n' "$APP_TAG" > release.env
          scp docker-compose.yml deploy/docker-compose.prod.yml deploy/Caddyfile \
              deploy/dl-compose.sh deploy/pg-backup.sh release.env "$TARGET:/opt/drivinglessons/"

      - name: Pull and restart
        run: |
          ssh "$TARGET" 'set -e
            cd /opt/drivinglessons
            chmod +x dl-compose.sh pg-backup.sh
            ./dl-compose.sh pull app
            ./dl-compose.sh up -d --remove-orphans'

      - name: Wait for health
        run: |
          deadline=$((SECONDS + 180))
          while (( SECONDS < deadline )); do
            body=$(curl -fsS --max-time 5 "https://$DOMAIN/api/health" || true)
            if [[ "$body" == "Healthy" ]]; then
              echo "Healthy on $APP_TAG"
              exit 0
            fi
            sleep 5
          done
          echo "Not healthy after 3 minutes - roll back (runbook section 3)." >&2
          echo "App logs stay on the server (this run log is public): ./dl-compose.sh logs --tail 200 app" >&2
          ssh "$TARGET" 'cd /opt/drivinglessons && ./dl-compose.sh ps'
          exit 1
