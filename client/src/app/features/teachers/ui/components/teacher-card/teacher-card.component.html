<article class="card">
  <header class="card__header">
    <span class="card__avatar" aria-hidden="true">{{ initials() }}</span>
    <div class="card__identity">
      <h3 class="card__name">{{ teacher().name }}</h3>
      <bdi class="card__email">{{ teacher().contactEmail }}</bdi>
    </div>
    <p-button
      [label]="'teachers.editTeacher' | transloco"
      severity="secondary"
      size="small"
      text
      (onClick)="edit.emit()" />
    <p-button
      icon="pi pi-trash"
      severity="danger"
      size="small"
      text
      [ariaLabel]="'teachers.deleteTeacher' | transloco"
      (onClick)="remove.emit()" />
  </header>

  @if (carChips().length) {
    <div class="card__cars">
      @for (chip of carChips(); track chip.id) {
        <span class="card__chip">
          {{ chip.name }}
          <span class="card__chip-tag">{{ chip.transmissionKey | transloco }}</span>
        </span>
      }
    </div>
  }
</article>
