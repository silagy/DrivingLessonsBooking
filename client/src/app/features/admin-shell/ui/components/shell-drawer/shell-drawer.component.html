<p-drawer
  [visible]="open()"
  (visibleChange)="open.set($event)"
  [position]="position()"
  styleClass="shell-drawer"
  [ariaCloseLabel]="'shell.closeMenu' | transloco"
  [pt]="{ root: { role: 'dialog', 'aria-modal': 'true', 'aria-label': ('shell.menu' | transloco) } }"
  (onHide)="dismissed.emit()">
  <ng-template #header>
    <app-brand-logo />
  </ng-template>

  <nav class="shell-drawer__nav">
    @for (item of navigation(); track item.labelKey) {
      <a
        [routerLink]="item.commands"
        routerLinkActive="shell-drawer__link--active"
        [routerLinkActiveOptions]="{ exact: item.exact }"
        class="shell-drawer__link"
        (click)="close()">
        {{ item.labelKey | transloco }}
      </a>
    }
  </nav>

  <div class="shell-drawer__footer">
    <div class="shell-drawer__language">
      <span>{{ 'shell.language' | transloco }}</span>
      <app-language-toggle [touch]="true" />
    </div>
    <div class="shell-drawer__appearance">
      <span>{{ 'shell.appearance.label' | transloco }}</span>
      <app-appearance-toggle />
    </div>
    @if (email(); as signedInEmail) {
      <div class="shell-drawer__who">
        <span class="shell-drawer__avatar" aria-hidden="true">{{ initials() }}</span>
        <bdi class="shell-drawer__email" dir="ltr">{{ signedInEmail }}</bdi>
      </div>
    }
    <p-button
      styleClass="shell-drawer__sign-out"
      [label]="'shell.logout' | transloco"
      text
      (onClick)="onSignOut()" />
  </div>
</p-drawer>
