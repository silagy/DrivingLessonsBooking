<div class="shell">
  <header class="shell__bar">
    <app-brand-logo />

    <nav class="shell__nav">
      @for (item of navigation(); track item.labelKey) {
        <a
          [routerLink]="item.commands"
          routerLinkActive="shell__nav-link--active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          class="shell__nav-link">
          {{ item.labelKey | transloco }}
        </a>
      }
    </nav>

    <div class="shell__actions">
      <app-language-toggle />

      <p-button
        [styleClass]="isUserMenuOpen() ? 'shell__user shell__user--open' : 'shell__user'"
        [ariaLabel]="'shell.userMenu' | transloco"
        [pt]="{ root: { 'aria-haspopup': 'menu', 'aria-expanded': isUserMenuOpen() ? 'true' : 'false' } }"
        severity="secondary"
        text
        (onClick)="onUserMenu($event)">
        <span class="shell__avatar" aria-hidden="true">{{ initials() }}</span>
        @if (auth.email(); as email) {
          <bdi class="shell__email" dir="ltr">{{ email }}</bdi>
        }
        <i class="pi pi-chevron-down shell__chevron" [class.shell__chevron--open]="isUserMenuOpen()" aria-hidden="true"></i>
      </p-button>

      <p-menu
        #userMenu
        [model]="userMenuItems()"
        [popup]="true"
        appendTo="body"
        styleClass="shell-user-menu"
        (onShow)="isUserMenuOpen.set(true)"
        (onHide)="isUserMenuOpen.set(false)">
        <ng-template #start>
          <div class="shell-user-menu__header">
            <span class="shell__avatar shell__avatar--large" aria-hidden="true">{{ initials() }}</span>
            <div class="shell-user-menu__identity">
              @if (auth.email(); as email) {
                <bdi class="shell-user-menu__email" dir="ltr">{{ email }}</bdi>
              }
              @if (auth.role(); as role) {
                <span
                  class="shell-user-menu__role"
                  [class.shell-user-menu__role--administrator]="role === roles.administrator"
                  [class.shell-user-menu__role--teacher]="role === roles.teacher">
                  {{ 'shell.roles.' + role | transloco }}
                </span>
              }
            </div>
          </div>
        </ng-template>
      </p-menu>
    </div>
  </header>

  <main class="shell__main">
    <router-outlet />
  </main>
</div>
