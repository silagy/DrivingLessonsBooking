<div class="shell">
  <header class="shell__bar">
    <app-brand-logo />

    <nav class="shell__nav">
      <a
        routerLink="/"
        routerLinkActive="shell__nav-link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="shell__nav-link">
        {{ 'shell.nav.dashboard' | transloco }}
      </a>
      <a
        [routerLink]="['/', appRoutes.teachers]"
        routerLinkActive="shell__nav-link--active"
        class="shell__nav-link">
        {{ 'shell.nav.teachers' | transloco }}
      </a>
      <a
        [routerLink]="['/', appRoutes.roster]"
        routerLinkActive="shell__nav-link--active"
        class="shell__nav-link">
        {{ 'shell.nav.roster' | transloco }}
      </a>
      <a
        [routerLink]="['/', appRoutes.weekSchedules]"
        routerLinkActive="shell__nav-link--active"
        class="shell__nav-link">
        {{ 'shell.nav.weeklyPrep' | transloco }}
      </a>
      <a
        [routerLink]="['/', appRoutes.publications]"
        routerLinkActive="shell__nav-link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="shell__nav-link">
        {{ 'shell.nav.publications' | transloco }}
      </a>
      <a
        [routerLink]="['/', appRoutes.publications, appRoutes.publicationsHistory]"
        routerLinkActive="shell__nav-link--active"
        class="shell__nav-link">
        {{ 'shell.nav.history' | transloco }}
      </a>
    </nav>

    <div class="shell__actions">
      <app-language-toggle />

      <div class="shell__user">
        <span class="shell__avatar" aria-hidden="true">{{ initials() }}</span>
        @if (auth.email(); as email) {
          <span class="shell__email">{{ email }}</span>
        }
      </div>

      <p-button
        [label]="'shell.logout' | transloco"
        (onClick)="auth.logout()"
        severity="secondary"
        size="small"
        text />
    </div>
  </header>

  <main class="shell__main">
    <router-outlet />
  </main>
</div>
