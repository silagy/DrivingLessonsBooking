@let tip = tipKey() | transloco: tipParams();
<span
  class="car-flag"
  [class.car-flag--muted]="!isActive()"
  tabindex="0"
  [attr.aria-label]="tip"
  [pTooltip]="tip"
  tooltipPosition="bottom"
  tooltipEvent="both">
  <i class="pi pi-exclamation-circle" aria-hidden="true"></i>
  {{ 'students.flag.car' | transloco }}
</span>
